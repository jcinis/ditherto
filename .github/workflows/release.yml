name: Release package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (select an unpublished version tag)
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  package:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PUBLISH_PACKAGE: ${{ github.event_name == 'release' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install a trusted-publishing-capable npm
        run: npm install --global npm@11.19.1
      - name: Validate release version
        id: version
        run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run test:package
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Pack the tested build
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ditherto-*.tgz
      - name: Check the publication archive
        if: env.PUBLISH_PACKAGE == 'true'
        env:
          PACKAGE_ARCHIVE: ditherto-${{ steps.version.outputs.version }}.tgz
        run: npm publish "./$PACKAGE_ARCHIVE" --dry-run --access public
      - name: Publish using npm trusted publishing
        if: env.PUBLISH_PACKAGE == 'true'
        env:
          PACKAGE_ARCHIVE: ditherto-${{ steps.version.outputs.version }}.tgz
        run: npm publish "./$PACKAGE_ARCHIVE" --access public
  homebrew:
    needs: package
    if: github.event_name == 'release' || inputs.publish
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.package.outputs.version }}
    secrets: inherit
